name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 素の Win32 ＋ Native AOT。2026-09-12 に WinUI 3 版を撤去し、これ 1 本になった
  # （経緯は docs/win32-migration/）。
  #
  # 成果物の名前 ExtendExprorer-win32-x64 は変えないこと。確認をお願いしている側の
  # 道具と、tmp/確認/old/ に残っている 20 回ぶんの依頼書がこの名前を指している。
  win32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (win-x64, self-contained, aot)
        run: >
          dotnet publish src/ExtendExprorer.Win32/ExtendExprorer.Win32.csproj
          -c Release -r win-x64 -p:Platform=x64
          --self-contained true
          -o publish-win32

      - uses: actions/upload-artifact@v4
        with:
          name: ExtendExprorer-win32-x64
          path: publish-win32
          retention-days: 30

      # --- ここから下はインストーラー（2026-09-23 追加。docs/installer/）---
      #
      # 成果物は 2 つになる。上の ExtendExprorer-win32-x64 は名前も中身も変えない。

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $csproj = 'src/ExtendExprorer.Win32/ExtendExprorer.Win32.csproj'
          $node = Select-Xml -Path $csproj -XPath '/Project/PropertyGroup/Version'
          if (-not $node) { throw "csproj に <Version> がありません: $csproj" }
          $v = $node.Node.InnerText.Trim()

          # ★ 数字は 2 つ並べる。csproj に書いた版数と、実際に exe へ焼かれた
          #   ファイルバージョンを突き合わせる。ずれたまま配ると
          #   「アプリと機能」の表示と中身が食い違う
          $fv = (Get-Item publish-win32/ExtendExprorer.exe).VersionInfo.FileVersion
          Write-Host "csproj=$v  exe=$fv"
          if ($fv -ne $v -and $fv -ne "$v.0") {
            throw "版数が合いません: csproj=$v exe=$fv"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe が見つかりません: $iscc" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} `
                  /O"installer-out" installer/ExtendExprorer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC が失敗しました ($LASTEXITCODE)" }
          Get-ChildItem installer-out | ForEach-Object {
            Write-Host ("{0}  {1:N0} bytes" -f $_.Name, $_.Length)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ExtendExprorer-setup
          path: installer-out
          retention-days: 30
